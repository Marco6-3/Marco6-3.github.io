short_bio: >-
  <p>I am an undergraduate student majoring in Intelligent Manufacturing Engineering at East China University of Science and Technology (ECUST), Shanghai, China.</p>
  <p>My research interests lie in <strong>robot learning</strong>, <strong>tactile sensing</strong>, <strong>contact-rich manipulation</strong>, and <strong>embodied AI</strong>. I am especially interested in how robots can use physical contact feedback to adapt their actions.</p>
  <p>Currently, I am exploring fast tactile-reactive control and residual action correction for robotic manipulation.</p>

